<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" aria-label="Snazzy Paws Grooming Logo">
  <defs>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Stylized Brand Badge / Paw Icon -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <!-- Main Paw Pad -->
    <ellipse cx="30" cy="38" rx="16" ry="12" fill="url(#pawGrad)" />
    <!-- 4 Toe Pads -->
    <ellipse cx="14" cy="22" rx="6" ry="8" fill="url(#pawGrad)" transform="rotate(-20 14 22)" />
    <ellipse cx="25" cy="15" rx="6" ry="9" fill="url(#pawGrad)" transform="rotate(-6 25 15)" />
    <ellipse cx="37" cy="15" rx="6" ry="9" fill="url(#pawGrad)" transform="rotate(6 37 15)" />
    <ellipse cx="48" cy="22" rx="6" ry="8" fill="url(#pawGrad)" transform="rotate(20 48 22)" />
    
    <!-- Stylized Grooming Sparkle -->
    <path d="M 46 8 Q 50 8 50 4 Q 50 8 54 8 Q 50 8 50 12 Q 50 8 46 8 Z" fill="#d97706" />
    <path d="M 12 10 Q 14 10 14 8 Q 14 10 16 10 Q 14 10 14 12 Q 14 10 12 10 Z" fill="#d97706" />
  </g>

  <!-- Typography: Snazzy Paws -->
  <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#1e3a8a" letter-spacing="-0.5px">Snazzy Paws</text>
  
  <!-- Sub-heading: GROOMING - HAMILTON, NZ -->
  <text x="78" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="2.5px">GROOMING</text>
  <circle cx="160" cy="53" r="2" fill="#d97706" />
  <text x="168" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="1px">HAMILTON, NZ</text>
</svg>
